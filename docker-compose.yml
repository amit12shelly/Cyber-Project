services:
  # --- שרת לוגין ---
  login-server:
    build: ./loginserver
    restart: always
    ports:
      - "8820:8820"
    environment:
      - LB_IP=192.168.5.87
      - LB_PORT=8080
    volumes:
      - ./loginserver/game.db:/loginserver/game.db

  # --- לווד בלנסר ---
  load-balancer:
    build: ./loadBalancer
    restart: always
    ports:
      - "8080:8080"
    environment:
      - LB_IP=0.0.0.0 # מאזין לכולם בתוך הרשת שלו
      - LB_PORT=8080

  # --- שרתי משחק (דוגמה ל-3 שרתים, תוכל להוסיף עד 5) ---
  game-server-1:
    build: ./server
    restart: always
    ports:
      - "4433:4433/udp" # QUIC
      - "8433:8433"     # P2P
    environment:
      - LB_IP=192.168.5.87
      - HOST_IP=192.168.5.87
      - MY_PORT=4433

  game-server-2:
    build: ./server
    restart: always
    ports:
      - "4434:4434/udp" # QUIC
      - "8434:8434"     # P2P
    environment:
      - LB_IP=192.168.5.87
      - HOST_IP=192.168.5.87
      - MY_PORT=4434

  game-server-3:
    build: ./server
    restart: always
    ports:
      - "4435:4435/udp" # QUIC
      - "8435:8435"     # P2P
    environment:
      - LB_IP=192.168.5.87
      - HOST_IP=192.168.5.87
      - MY_PORT=4435

# אפשר להמשיך ל-4 ו-5 באותה שיטה...